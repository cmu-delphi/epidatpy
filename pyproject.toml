# This file was derived from the PyPA Sample Project
# https://github.com/pypa/sampleproject

# Guide (user-friendly):
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/

# Specification (technical, formal):
# https://packaging.python.org/en/latest/specifications/pyproject-toml/


[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epidatpy"
version = "0.5.0"
description = "A programmatic interface to Delphi's Epidata API."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Delphi Research Group" }]
maintainers = [{ name = "Dmitry Shemetov", email = "dshemeto@andrew.cmu.edu" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.9"
dependencies = [
    "appdirs>=1.4.4",
    "diskcache>=5.6.3",
    "epiweeks>=2.1",
    "pandas>=2",
    "requests>=2.25",
    "syrupy>=4.9.1",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel",
    "matplotlib",
    "mypy",
    "nbsphinx",
    "pytest",
    "syrupy",
    "recommonmark",
    "ruff",
    "sphinx_rtd_theme",
    "sphinx-autodoc-typehints",
    "sphinx",
    "twine",
    "types-requests",
]

[project.urls]
homepage = "https://github.com/cmu-delphi/epidatpy"
repository = "https://github.com/cmu-delphi/epidatpy"


[tool.ruff]
target-version = "py39"
line-length = 120
format.docstring-code-format = true
format.docstring-code-line-length = "dynamic"
lint.extend-select = [
    "I",  # isort
    "UP", # pyupgrade
]

[tool.mypy]
strict = true
ignore_missing_imports = true
disallow_subclassing_any = false
disallow_any_generics = false
implicit_reexport = true
warn_redundant_casts = false
exclude = "(tasks|setup).py"
