name: Create Release

# Cuts a release from dev, whose version (pyproject.toml) is ALREADY bumped.
# Bumping is done by a human in a normal, reviewed PR; this workflow never
# commits to a protected branch. It tags vX.Y.Z at the branch HEAD and creates
# a GitHub Release whose notes are the "## X.Y.Z" section of CHANGELOG.md
# (written in a reviewed PR beforehand; the run fails without it).
# Pushing the tag triggers pypi_publish.yml (build + upload to PyPI) and
# documentation.yml; publishing is intentionally a separate, independently
# re-runnable workflow.
on:
  workflow_dispatch:

concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'cmu-delphi'
    permissions:
      contents: write
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.CMU_DELPHI_DEPLOY_MACHINE_SSH }}
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
      - name: Check changelog and tag
        id: version
        run: |
          VERSION=$(uv version --short)
          echo "Releasing $VERSION from ${{ github.ref_name }}"

          # The release notes are this version's CHANGELOG.md section (see
          # DEVELOPMENT.md). Check before pushing the tag, so a missing section
          # fails without leaving a half-made release behind.
          awk -v h="## $VERSION" '$0 == h {f = 1; next} /^## / {f = 0} f' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "ERROR: CHANGELOG.md has no '## $VERSION' section (or it is empty)." \
              "Add it in a PR first (run 'just changelog'), then re-run."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "ERROR: tag v$VERSION already exists. Was the version bumped?"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Tag and create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION=${{ steps.version.outputs.version }}
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" \
            --target "$(git rev-parse HEAD)" \
            --title "v$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
